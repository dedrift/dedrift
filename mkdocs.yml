site_name: dedrift
site_url: https://dedrift.ai
site_description: >-
  Statistically rigorous behavioral drift detection for AI agents.
repo_url: https://github.com/dedrift/dedrift
repo_name: dedrift/dedrift
copyright: AGPL-3.0 &middot; <a href="mailto:support@dedrift.ai">support@dedrift.ai</a>

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Case study: case-study.md
  - Statistics: statistics.md
  - Guide:
      - How it works: how-it-works.md
      - Writing canary suites: canaries.md
      - Configuration: configuration.md
      - CLI reference: cli.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Types (mypy)
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Unit tests
        run: pytest -m "not calibration and not power"
      - name: Calibration & power tests
        if: matrix.python-version == '3.12'
        run: pytest -m "calibration or power"

  package:
    name: Built-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install and verify the wheel in isolation
        run: |
          python -m venv /tmp/dedrift-wheel-smoke
          /tmp/dedrift-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/dedrift-wheel-smoke/bin/python -m pip check
          /tmp/dedrift-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version

          import dedrift

          assert dedrift.__version__ == version("dedrift"), (
              dedrift.__version__,
              version("dedrift"),
          )
          PY
          /tmp/dedrift-wheel-smoke/bin/dedrift --help

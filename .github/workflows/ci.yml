name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Types (mypy)
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Unit tests
        run: pytest -m "not calibration and not power"
      - name: Calibration & power tests
        # Exit code 5 = no tests collected; tolerated until the detector
        # calibration/power suites land in Phase 2, then enforced as usual.
        run: |
          set +e
          pytest -m "calibration or power"
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "No calibration/power tests yet (Phase 2)."
            exit 0
          fi
          exit "$rc"
